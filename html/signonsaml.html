<html>
<body>
<div>
    Redirecting, please wait...
</div>
<script type='text/javascript'>
    var site = "ps";
    var portal = "EMPLOYEE";
    var node = "HRMS";

    var redirectURL = "<%=error%>";
    if (redirectURL === "") {
        document.cookie = "ps_dest=" + window.location.href + "; Path=/; SameSite=Strict; Secure";
        window.location.href = "/psp/" + site + "/" + portal + "/" + node + "/c/NUI_FRAMEWORK.PT_LANDINGPAGE.GBL";
    }
    else if (redirectURL.substring(0, 7) !== "ERROR: ") {
        window.location.href = redirectURL + getRelayState();
    } else {
        document.write(redirectURL);
    }

    function getRelayState() {
        var relayURL = "";
        var currentLocation = "";
        var cookie = document.cookie.split('; ').find(function(row){return (row.substring(0, 8) === 'ps_dest=')});
        if (cookie) {
            currentLocation = cookie.split('=').slice(1).join("=");
            document.cookie = "ps_dest=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/; SameSite=Strict; Secure";
        } else {
            currentLocation = window.location.href;
        }

        if (currentLocation.indexOf("/c/") > -1 || currentLocation.indexOf("/s/") > -1) {
            var queryStringPos = currentLocation.indexOf("?");
            if (queryStringPos > -1) {
                relayURL = currentLocation.substring(0, queryStringPos);
            } else {
                relayURL = currentLocation;
            }
        }

        if (relayURL !== "") {
            return "&RelayState=" + relayURL;
        } else {
            return "";
        }
    }
</script>
</body>
</html>
